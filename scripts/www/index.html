<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>简易表格 · 专业版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #eef2ff 0%, #cbdbe9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }

        /* 加载动画 */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1rem;
            color: #3b82f6;
            font-weight: 500;
        }

        .glass-card {
            max-width: 100%;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: none;  /* 初始隐藏，加载完成后显示 */
        }

        .card-inner {
            padding: 14px;
        }

        .hero-title {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(120deg, #0b2b3f, #1e5a8a);
            background-clip: text;
            -webkit-background-clip: text;
            margin-bottom: 4px;
            text-align: center;
        }
        .sub-line {
            color: #4a627a;
            border-left: 3px solid #3b82f6;
            padding-left: 8px;
            margin: 6px 0 16px 0;
            font-weight: 500;
            font-size: 0.85rem;
            text-align: left;
        }

        .maker-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .maker-label {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.85rem;
        }
        .maker-input {
            padding: 6px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 40px;
            font-size: 0.85rem;
            width: 150px;
        }

        .headers-manager {
            background: rgba(249, 251, 254, 0.8);
            border-radius: 18px;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid rgba(226, 237, 247, 0.8);
        }
        .headers-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .header-item {
            background: white;
            border-radius: 14px;
            border: 1px solid #e9edf2;
            padding: 10px;
        }

        /* 强制一行显示 + 横向滚动 */
        .header-main-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;          /* 禁止换行 */
            overflow-x: auto;           /* 横向滚动 */
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;        /* 留出滚动条空间 */
            margin-bottom: 8px;
            scrollbar-width: thin;
        }
        /* 各元素固定宽度/不缩小 */
        .header-index {
            flex-shrink: 0;
            background: #3b82f6;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 20px;
        }
        .check-wrapper, .formula-check {
            flex-shrink: 0;
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .formula-check input {
            width: 14px;
            height: 14px;
            margin: 0;
        }
        .header-item input[type="text"] {
            flex-shrink: 1;
            min-width: 100px;
            padding: 6px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 0.9rem;
            background: white;
        }
        .icon-circle {
            flex-shrink: 0;
            background: #f1f5f9;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        /* 公式行可以换行（单独一行） */
        .formula-row {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            padding-top: 6px;
            border-top: 1px dashed #e2e8f0;
            font-size: 0.8rem;
        }
        .formula-label {
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 18px;
            font-size: 0.75rem;
        }
        .formula-input {
            flex: 1;
            min-width: 130px;
            padding: 5px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            font-family: monospace;
            font-size: 0.8rem;
            background: #fffef7;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
            display: block;
            font-size: 0.85rem;
        }
        .main-input {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .btn {
            border: none;
            padding: 8px 12px;
            border-radius: 32px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            flex: 1;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e4a76, #0f3b5e);
            color: white;
        }
        .btn-secondary {
            background: rgba(238, 242, 255, 0.8);
            color: #1e4a76;
        }
        .btn-success {
            background: linear-gradient(135deg, #2b6e4f, #1f543c);
            color: white;
        }
        .btn-import {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        .top-bar .form-group {
            margin-bottom: 0;
        }
        .top-bar-buttons {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .top-bar-buttons .btn {
            flex: 1;
            padding: 8px 0;
        }

        .info-panel {
            background: rgba(240, 246, 254, 0.9);
            border-radius: 18px;
            padding: 8px 10px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: space-between;
        }
        .badge-info {
            background: white;
            padding: 4px 10px;
            border-radius: 32px;
            font-size: 0.8rem;
        }

        .scrollable-table {
            width: 100%;
            overflow-x: hidden;
        }
        .unified-table {
            width: 100%;
        }
        .headers-preview, .data-row, .total-row {
            display: grid;
            gap: 6px;
            align-items: center;
            width: 100%;
        }
        .headers-preview {
            background: #f1f5f9;
            padding: 8px;
            border-radius: 14px;
            margin-bottom: 8px;
        }
        .data-row {
            border: 1px solid #e9edf2;
            border-radius: 14px;
            padding: 6px;
            margin-bottom: 6px;
        }
        .total-row {
            background: #f9fafb;
            border-radius: 14px;
            padding: 6px;
            margin-top: 4px;
            font-weight: bold;
        }
        .preview-serial, .preview-action {
            text-align: center;
            background: #e6f0fa;
            padding: 6px 2px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            white-space: normal;
            word-break: break-word;
        }
        .header-preview-item {
            text-align: center;
            background: white;
            padding: 6px 2px;
            border-radius: 10px;
            font-size: 0.8rem;
            word-break: break-word;
        }
        .row-index {
            font-weight: 700;
            color: #3b82f6;
            background: #eff6ff;
            border-radius: 32px;
            text-align: center;
            padding: 4px 2px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .add-row-btn {
            background: #e0f2fe;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 0.7rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .data-field input {
            width: 100%;
            padding: 4px 2px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            font-size: 0.8rem;
            text-align: center;
            cursor: pointer;
            background: #fef9e6;
        }
        .data-field input.formula-field {
            background: #fefce8;
            border-color: #fde047;
            cursor: default;
        }
        .row-actions {
            display: flex;
            gap: 2px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .move-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            width: 26px;
            height: 26px;
            border-radius: 40%;
            font-size: 0.7rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .delete-row-btn {
            background: none;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            color: #94a3b8;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .total-value {
            text-align: center;
            font-weight: bold;
        }
        .action-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: space-between;
        }
        .action-group .btn {
            flex: 1;
            padding: 8px 0;
        }
        .hidden-section {
            display: none;
        }
        .formula-hint {
            font-size: 0.65rem;
            color: #6c86a3;
        }
        .formula-row.hidden {
            display: none;
        }

        .image-section {
            margin-top: 16px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }
        .image-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .image-section-header label {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.85rem;
        }
        .upload-image-btn {
            background: #e0f2fe;
            border: none;
            padding: 4px 12px;
            border-radius: 24px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .image-preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
            overflow: hidden;
        }
        .image-preview {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            display: block;
        }
        .delete-image-btn {
            background: #fee2e2;
            border: none;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            width: 90%;
            max-width: 400px;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-content textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            margin: 12px 0;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 8px 20px;
            border-radius: 32px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-buttons .confirm {
            background: #3b82f6;
            color: white;
        }
        .modal-buttons .cancel {
            background: #e2e8f0;
            color: #334155;
        }

        @media (max-width: 480px) {
            .card-inner { padding: 10px; }
            .header-item input[type="text"] { min-width: 80px; padding: 5px 6px; }
            .icon-circle { width: 26px; height: 26px; font-size: 0.75rem; }
            .formula-input { min-width: 110px; padding: 4px 6px; }
            .preview-serial, .preview-action { font-size: 0.75rem; padding: 4px 1px; }
            .header-preview-item { font-size: 0.75rem; padding: 4px 1px; }
            .row-index { font-size: 0.75rem; padding: 3px 1px; }
            .add-row-btn { width: 20px; height: 20px; font-size: 0.65rem; }
            .data-field input { padding: 3px 1px; font-size: 0.75rem; }
            .move-btn, .delete-row-btn { width: 24px; height: 24px; font-size: 0.7rem; }
            .modal-content { width: 95%; padding: 16px; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">正在加载...</div>
    </div>

    <div class="glass-card" id="appContainer">
        <div class="card-inner">
            <div class="hero-title">📋 简易表格</div>
            <div class="top-bar">
                <div class="form-group">
                    <label>📌 主标题</label>
                    <input type="text" id="mainTitleInput" class="main-input" value="项目数据统计表">
                </div>
                <div class="maker-row">
                    <span class="maker-label">制表人：</span>
                    <input type="text" id="makerInput" class="maker-input" placeholder="输入姓名" value="">
                </div>
                <div class="top-bar-buttons">
                    <button id="importExcelBtn" class="btn btn-import">📂 导入表格</button>
                    <button id="fillContentBtn" class="btn btn-primary">✍️ 填写内容</button>
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;">
                </div>
            </div>
            <div class="headers-manager">
                <div class="headers-title" style="margin-bottom: 6px;">
                    <span style="font-size: 0.85rem;">📋 表头配置（列索引 A, B, C...，公式支持大小写字母如 A*B 或 a*b）</span>
                </div>
                <div id="headersListContainer" class="headers-list"></div>
                <div style="font-size: 0.65rem; color: #6c86a3; margin-top: 6px;">
                    💡 公式示例：<code>A*B</code> 或 <code>a*b</code> 或 <code>(单价)*(数量)</code>，支持 + - * / 和括号。<br>
                    📌 启用公式后，该列自动计算，不可编辑。
                </div>
            </div>

            <div id="dataSection" class="data-section hidden-section">
                <div class="info-panel">
                    <div class="badge-info">🏷️ 主标题：<strong id="displayMainTitleSpan">—</strong></div>
                    <div class="badge-info">📐 列数 <span id="headerCountSpan">0</span></div>
                    <div class="badge-info">✍️ 制表人：<strong id="displayMakerSpan">—</strong></div>
                </div>
                <div class="scrollable-table">
                    <div class="unified-table">
                        <div id="headersPreviewRow" class="headers-preview"></div>
                        <div id="dataRowsContainer" class="items-container"></div>
                    </div>
                </div>
                <div class="image-section">
                    <div class="image-section-header">
                        <label>📷 附加图片</label>
                        <div>
                            <button id="uploadImageBtn" class="upload-image-btn">📤 上传图片</button>
                            <button id="deleteImageBtn" class="delete-image-btn" style="display: none;">🗑️ 删除图片</button>
                        </div>
                    </div>
                    <div class="image-preview-container" id="imagePreviewContainer"></div>
                </div>
                <div class="action-group">
                    <button id="genExcelBtn" class="btn btn-success">📎 生成并分享 Excel</button>
                    <button id="genPdfBtn" class="btn btn-primary" style="background: #4b5563;">📑 生成并分享 PDF</button>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 8px;">编辑内容</h3>
            <textarea id="modalInput" rows="3"></textarea>
            <div class="modal-buttons">
                <button class="cancel" onclick="closeModal()">取消</button>
                <button class="confirm" onclick="saveModal()">确定</button>
            </div>
        </div>
    </div>

    <!-- 外部脚本使用 defer，不阻塞渲染 -->
    <script defer src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        // 全局变量定义
        let appData = {
            mainTitle: "项目数据统计表",
            maker: "",
            headers: [
                { name: "项目", sumEnabled: false, enableFormula: false, formula: "" },
                { name: "单价", sumEnabled: false, enableFormula: false, formula: "" },
                { name: "数量", sumEnabled: false, enableFormula: false, formula: "" },
                { name: "总价", sumEnabled: true, enableFormula: true, formula: "B*C" }
            ],
            rows: [
                ["项目一", "100", "5", ""],
                ["项目二", "200", "3", ""]
            ]
        };
        let attachedImage = null;

        // DOM 元素引用
        let mainTitleInput, makerInput, headersListContainer, fillContentBtn, importExcelBtn, excelFileInput;
        let dataSection, displayMainTitleSpan, displayMakerSpan, headerCountSpan, headersPreviewRow, dataRowsContainer;
        let genExcelBtn, genPdfBtn, uploadImageBtn, deleteImageBtn, imagePreviewContainer;
        let modal, modalInput, currentEditInput;

        // ==================== 辅助函数 ====================
        function updateImagePreview() {
            imagePreviewContainer.innerHTML = '';
            if (attachedImage) {
                const img = document.createElement('img');
                img.src = attachedImage;
                img.className = 'image-preview';
                imagePreviewContainer.appendChild(img);
            } else {
                const placeholder = document.createElement('div');
                placeholder.style.padding = '20px';
                placeholder.style.color = '#6c86a3';
                placeholder.style.fontSize = '0.7rem';
                placeholder.innerText = '暂无图片，点击上方按钮上传';
                imagePreviewContainer.appendChild(placeholder);
            }
        }

        function openModal(inputElement) {
            currentEditInput = inputElement;
            modalInput.value = inputElement.value;
            modal.style.display = 'flex';
            modalInput.focus();
        }

        function closeModal() {
            modal.style.display = 'none';
            currentEditInput = null;
        }

        function saveModal() {
            if (currentEditInput) {
                const newValue = modalInput.value;
                const row = parseInt(currentEditInput.getAttribute('data-row'));
                const col = parseInt(currentEditInput.getAttribute('data-col'));
                if (!isNaN(row) && !isNaN(col) && appData.rows[row]) {
                    appData.rows[row][col] = newValue;
                    currentEditInput.value = newValue;
                    updateFormulaValues();
                    renderDataArea();
                } else {
                    currentEditInput.value = newValue;
                }
            }
            closeModal();
        }

        function colIndexToLetter(index) {
            let result = '';
            let n = index;
            while (n >= 0) {
                result = String.fromCharCode(65 + (n % 26)) + result;
                n = Math.floor(n / 26) - 1;
            }
            return result;
        }

        function letterToColIndex(letter) {
            const upper = letter.toUpperCase();
            let result = 0;
            for (let i = 0; i < upper.length; i++) {
                result = result * 26 + (upper.charCodeAt(i) - 64);
            }
            return result - 1;
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function evaluateFormula(formula, rowData, headers) {
            if (!formula || formula.trim() === "") return "";
            let expr = formula;
            try {
                const letterRegex = /\b([A-Za-z]+)\b/g;
                let match;
                const replacements = [];
                while ((match = letterRegex.exec(expr)) !== null) {
                    const letter = match[1];
                    const colIdx = letterToColIndex(letter);
                    if (colIdx >= 0 && colIdx < headers.length) {
                        const val = parseFloat(rowData[colIdx]);
                        const numericVal = isNaN(val) ? 0 : val;
                        replacements.push({ pattern: new RegExp(`\\b${letter}\\b`, 'g'), value: numericVal });
                    }
                }
                for (const rep of replacements) {
                    expr = expr.replace(rep.pattern, rep.value);
                }
                const result = Function('"use strict"; return (' + expr + ')')();
                return isNaN(result) ? "" : String(result);
            } catch (e) {
                console.warn("公式错误:", formula, e);
                return "#公式错误#";
            }
        }

        function updateFormulaValues() {
            for (let rowIdx = 0; rowIdx < appData.rows.length; rowIdx++) {
                for (let colIdx = 0; colIdx < appData.headers.length; colIdx++) {
                    const header = appData.headers[colIdx];
                    if (header.enableFormula && header.formula && header.formula.trim() !== "") {
                        const computed = evaluateFormula(header.formula, appData.rows[rowIdx], appData.headers);
                        appData.rows[rowIdx][colIdx] = computed;
                    }
                }
            }
        }

        function getGridTemplateColumns() {

        function calculateTotals() {
            const totals = new Array(appData.headers.length).fill(0);
            for (let row of appData.rows) {
                for (let i = 0; i < appData.headers.length; i++) {
                    if (appData.headers[i].sumEnabled) {
                        const val = parseFloat(row[i]);
                        if (!isNaN(val)) totals[i] += val;
                    }
                }
            }
            return totals;
        }

        function handleEditableClick(e) { e.preventDefault(); openModal(e.target); }
        function handleAddRowBelow(e) {
            const currentRow = parseInt(e.currentTarget.getAttribute('data-row'));
            const newRow = new Array(appData.headers.length).fill("");
            appData.rows.splice(currentRow + 1, 0, newRow);
            updateFormulaValues();
            renderDataArea();
            setTimeout(() => {
                const newRowDiv = document.querySelector(`.data-row[data-row-index="${currentRow+1}"]`);
                if (newRowDiv) newRowDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        }
        function handleDeleteRow(e) {
            const rowIdx = parseInt(e.currentTarget.getAttribute('data-row'));
            if (appData.rows.length === 1) {
                appData.rows[0] = new Array(appData.headers.length).fill("");
                updateFormulaValues();
                renderDataArea();
                alert("至少保留一行，已清空");
            } else {
                appData.rows.splice(rowIdx, 1);
                renderDataArea();
            }
        }
        function handleMoveUp(e) {
            const rowIdx = parseInt(e.currentTarget.getAttribute('data-row'));
            if (rowIdx > 0) {
                [appData.rows[rowIdx-1], appData.rows[rowIdx]] = [appData.rows[rowIdx], appData.rows[rowIdx-1]];
                renderDataArea();
            }
        }
        function handleMoveDown(e) {
            const rowIdx = parseInt(e.currentTarget.getAttribute('data-row'));
            if (rowIdx < appData.rows.length - 1) {
                [appData.rows[rowIdx], appData.rows[rowIdx+1]] = [appData.rows[rowIdx+1], appData.rows[rowIdx]];
                renderDataArea();
            }
        }

        function isSerialColumn(name) {
            if (!name) return false;
            const lower = name.toString().toLowerCase().trim();
            const keywords = ['序号', '序列号', '编号', 'no', 'no.', 'sn', 'sn.', 'serial', 'number', '序號'];
            return keywords.some(k => lower === k || lower === k + '.');
        }

        function isMakerRow(row) {
            if (!row || row.length === 0) return false;
            const firstCell = String(row[0] || '').trim();
            return firstCell.includes('制表人：') || firstCell.includes('制表人');
        }

        function isTotalRow(row) {
            if (!row || row.length === 0) return false;
            const firstCell = String(row[0] || '').trim();
            return firstCell === '合计' || firstCell.includes('合计');
        }

        function extractMakerFromRow(row) {
            if (!row || row.length === 0) return '';
            const firstCell = String(row[0] || '').trim();
            const match = firstCell.match(/制表人[：:]\s*(.*)/);
            if (match) return match[1].trim();
            return '';
        }

        function importExcel(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
                if (!jsonData || jsonData.length === 0) { alert("文件为空"); return; }

                let mainTitle = "导入表格";
                if (jsonData[0] && jsonData[0][0] !== undefined && jsonData[0][0] !== "") {
                    mainTitle = String(jsonData[0][0]);
                }

                let makerValue = "";
                let headerRowIndex = 1;
                let dataStartIndex = 2;
                if (jsonData[1] && isMakerRow(jsonData[1])) {
                    makerValue = extractMakerFromRow(jsonData[1]);
                    headerRowIndex = 2;
                    dataStartIndex = 3;
                } else if (jsonData[2] && isMakerRow(jsonData[2])) {
                    makerValue = extractMakerFromRow(jsonData[2]);
                    headerRowIndex = 3;
                    dataStartIndex = 4;
                }

                if (!jsonData[headerRowIndex] || jsonData[headerRowIndex].length === 0) {
                    alert("无法识别表头行");
                    return;
                }

                const rawHeaderRow = jsonData[headerRowIndex];
                const validIndices = [];
                const newHeaders = [];
                for (let i = 0; i < rawHeaderRow.length; i++) {
                    const colName = String(rawHeaderRow[i] || "").trim();
                    if (!isSerialColumn(colName)) {
                        validIndices.push(i);
                        newHeaders.push({ name: colName || `列${i+1}`, sumEnabled: false, enableFormula: false, formula: "" });
                    }
                }
                if (newHeaders.length === 0) { alert("所有表头均为序号列，无法导入"); return; }

                const dataRows = [];
                for (let i = dataStartIndex; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (isTotalRow(row)) continue;
                    const filledRow = [];
                    for (let j = 0; j < validIndices.length; j++) {
                        const colIdx = validIndices[j];
                        filledRow.push(row[colIdx] !== undefined ? String(row[colIdx]) : "");
                    }
                    dataRows.push(filledRow);
                }

                appData.mainTitle = mainTitle;
                mainTitleInput.value = mainTitle;
                if (makerValue) {
                    appData.maker = makerValue;
                    makerInput.value = makerValue;
                }
                appData.headers = newHeaders;
                appData.rows = dataRows.length > 0 ? dataRows : [new Array(newHeaders.length).fill("")];
                updateFormulaValues();
                renderHeadersManager();
                dataSection.classList.remove('hidden-section');
                renderDataArea();
                alert(`导入成功！\n主标题: ${mainTitle}\n制表人: ${makerValue || '未提取'}\n${newHeaders.length} 列，${appData.rows.length} 行数据。已跳过序号列和合计行。`);
            };
            reader.readAsArrayBuffer(file);
        }

        function fillContent() {
            if (appData.rows.length === 0 || (appData.rows.length === 1 && appData.rows[0].every(c => c === ""))) {
                appData.rows = [new Array(appData.headers.length).fill("")];
                updateFormulaValues();
            }
            dataSection.classList.remove('hidden-section');
            renderDataArea();
        }

        async function generateExcelWithImage() {
            if (!appData.headers.length) { alert("至少保留一个表头"); return; }
            const totals = calculateTotals();
            const hasSum = appData.headers.some(h => h.sumEnabled);
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('数据');
            worksheet.mergeCells(`A1:${String.fromCharCode(65 + appData.headers.length)}1`);
            worksheet.getCell('A1').value = appData.mainTitle;
            worksheet.getCell('A1').font = { bold: true, size: 14 };
            worksheet.getCell('A1').alignment = { horizontal: 'center' };
            const makerRowIndex = 2;
            worksheet.mergeCells(`A${makerRowIndex}:${String.fromCharCode(65 + appData.headers.length)}${makerRowIndex}`);
            worksheet.getCell(`A${makerRowIndex}`).value = `制表人：${appData.maker || '—'}`;
            worksheet.getCell(`A${makerRowIndex}`).alignment = { horizontal: 'right' };
            worksheet.getCell(`A${makerRowIndex}`).font = { italic: true, size: 10 };
            const headerRowCells = ['序号', ...appData.headers.map(h => h.name)];
            const headerRow = worksheet.addRow(headerRowCells);
            headerRow.eachCell((cell) => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE6F0FA' } };
                cell.font = { bold: true };
                cell.border = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } };
            });
            for (let i = 0; i < appData.rows.length; i++) {
                const row = worksheet.addRow([i+1, ...appData.rows[i]]);
                row.eachCell(cell => { cell.border = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } }; });
            }
            if (hasSum) {
                const totalRow = worksheet.addRow(['合计', ...totals.map((v, idx) => appData.headers[idx].sumEnabled ? v : '—')]);
                totalRow.eachCell(cell => {
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF9FAFB' } };
                    cell.font = { bold: true };
                    cell.border = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } };
                });
            }
            if (attachedImage) {
                const dataRowsCount = 2 + 1 + appData.rows.length + (hasSum ? 1 : 0);
                const imageRow = dataRowsCount + 2;
                const base64Data = attachedImage.split(',')[1];
                const imageBuffer = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
                const imageId = workbook.addImage({ buffer: imageBuffer, extension: 'png', type: 'image' });
                worksheet.addImage(imageId, { tl: { col: 0, row: imageRow - 1 }, ext: { width: 300, height: 200 } });
            }
            worksheet.columns = [{ width: 8 }, ...appData.headers.map(() => ({ width: 16 }))];
            const buffer = await workbook.xlsx.writeBuffer();
            return new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        }

        async function generatePDFWithImage() {
            const totals = calculateTotals();
            const hasSum = appData.headers.some(h => h.sumEnabled);
            let html = `<div style="text-align:center; margin-bottom:8px;"><h2>${escapeHtml(appData.mainTitle)}</h2></div>`;

            for (let i = 0; i < appData.rows.length; i++) {
                html += `<\/tr>`;

                }

                html += `<div style="text-align:center; margin-top:20px;"><img src="${attachedImage}" style="max-width:100%; max-height:300px; object-fit:contain;"></div>`;
            }
            const container = document.createElement('div');
            container.style.position = 'fixed';
            container.style.left = '-9999px';
            container.style.top = '0';
            container.style.background = 'white';
            container.style.padding = '20px';
            container.style.display = 'inline-block';
            container.innerHTML = html;
            document.body.appendChild(container);
            try {
                const canvas = await html2canvas(container, { scale: 2, backgroundColor: '#ffffff', logging: false });
                document.body.removeChild(container);
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: canvas.width > canvas.height ? 'landscape' : 'portrait', unit: 'px', format: [canvas.width, canvas.height] });
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                return pdf.output('blob');
            } catch (err) { document.body.removeChild(container); throw err; }
        }

        function downloadFile(blob, fileName) {
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function tryShareAndDownload(blob, fileName, mimeType) {
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [] }) && window.location.protocol !== 'file:') {
                try {
                    const file = new File([blob], fileName, { type: mimeType });
                    await navigator.share({ title: appData.mainTitle, text: `分享表格: ${appData.mainTitle}`, files: [file] });
                    return true;
                } catch (err) { console.log('分享失败或取消:', err); }
            } else {
                console.log('当前环境不支持 Web Share API，自动下载');
            }
            downloadFile(blob, fileName);
            return false;
        }

        async function handleGenerateExcel() {
            const toast = showTempToast("生成Excel...");
            try {
                const blob = await generateExcelWithImage();
                await tryShareAndDownload(blob, `${appData.mainTitle.replace(/[\\/:*?"<>|]/g, '')}_表格.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
            } catch (err) {
                console.error(err);
                alert("生成失败：" + err.message);
            } finally { if(toast) toast(); }
        }

        async function handleGeneratePDF() {
            const toast = showTempToast("生成PDF...");
            try {
                const blob = await generatePDFWithImage();
                await tryShareAndDownload(blob, `${appData.mainTitle.replace(/[\\/:*?"<>|]/g, '')}_报告.pdf`, 'application/pdf');
            } catch (err) { 
                alert("PDF生成失败：" + err.message);
            } finally { if(toast) toast(); }

        function showTempToast(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#1f2937';
            toast.style.color = 'white';
            toast.style.padding = '6px 14px';
            toast.style.borderRadius = '32px';
            toast.style.zIndex = '9999';
            toast.style.fontSize = '0.7rem';
            document.body.appendChild(toast);
            return () => { if (toast && toast.remove) toast.remove(); };
        }

        // 初始化入口
        function init() {
            mainTitleInput = document.getElementById('mainTitleInput');
            makerInput = document.getElementById('makerInput');
            headersListContainer = document.getElementById('headersListContainer');
            fillContentBtn = document.getElementById('fillContentBtn');
            importExcelBtn = document.getElementById('importExcelBtn');
            excelFileInput = document.getElementById('excelFileInput');
            dataSection = document.getElementById('dataSection');
            displayMainTitleSpan = document.getElementById('displayMainTitleSpan');
            displayMakerSpan = document.getElementById('displayMakerSpan');
            headerCountSpan = document.getElementById('headerCountSpan');
            headersPreviewRow = document.getElementById('headersPreviewRow');
            dataRowsContainer = document.getElementById('dataRowsContainer');
            genExcelBtn = document.getElementById('genExcelBtn');
            genPdfBtn = document.getElementById('genPdfBtn');
            uploadImageBtn = document.getElementById('uploadImageBtn');
            deleteImageBtn = document.getElementById('deleteImageBtn');
            imagePreviewContainer = document.getElementById('imagePreviewContainer');
            modal = document.getElementById('editModal');
            modalInput = document.getElementById('modalInput');

            makerInput.addEventListener('input', () => {
                appData.maker = makerInput.value;
                if (dataSection && !dataSection.classList.contains('hidden-section')) displayMakerSpan.innerText = appData.maker || '—';
            });
            uploadImageBtn.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            attachedImage = ev.target.result;
                            updateImagePreview();
                            deleteImageBtn.style.display = 'inline-block';
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            });
            deleteImageBtn.addEventListener('click', () => {
                attachedImage = null;
                updateImagePreview();
                deleteImageBtn.style.display = 'none';
            });
            fillContentBtn.addEventListener('click', fillContent);
            importExcelBtn.addEventListener('click', () => excelFileInput.click());
            excelFileInput.addEventListener('change', (e) => { if (e.target.files.length) { importExcel(e.target.files[0]); excelFileInput.value = ''; } });
            genExcelBtn.addEventListener('click', handleGenerateExcel);
            genPdfBtn.addEventListener('click', handleGeneratePDF);
            mainTitleInput.addEventListener('input', () => {
                appData.mainTitle = mainTitleInput.value;
                if (dataSection && !dataSection.classList.contains('hidden-section')) displayMainTitleSpan.innerText = appData.mainTitle;
            });

            renderHeadersManager();
            mainTitleInput.value = appData.mainTitle;
            makerInput.value = appData.maker;
            updateFormulaValues();
            updateImagePreview();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
        }

        // 等待所有脚本加载完成
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(init, 100);
            });
        } else {
            setTimeout(init, 100);
        }
    </script>
</body>
